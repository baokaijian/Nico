name: Publish selected Nico summary
on:
  push:
    branches: [master]
  workflow_dispatch:
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_APP_MODE: public
      VITE_API_URL: https://oeyirzlgqixvcxofimit.supabase.co/functions/v1/nico-api
      NICO_TEST_PROTOCOL_ONLY: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Refuse an empty replacement for the existing public site
        run: node scripts/check-public-release.mjs
      - name: Require actual compatible API before publishing Pages
        if: github.event_name != 'pull_request'
        run: node scripts/verify-deployment.mjs --wait
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
  verify:
    # V1.6 发布失败/版本不一致告警：部署后独立核对线上实际资源与本次构建、实际API指纹。
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    env:
      VITE_APP_MODE: public
      VITE_API_URL: https://oeyirzlgqixvcxofimit.supabase.co/functions/v1/nico-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify deployed pages assets and live API fingerprint
        run: |
          for attempt in 1 2 3 4 5; do
            if node scripts/verify-release-consistency.mjs; then exit 0; fi
            echo "verify attempt ${attempt} failed; waiting for pages propagation"
            sleep 20
          done
          echo "发布验证失败：线上资源、版本或API指纹与本次发布不一致"
          exit 1
  notify-failure:
    if: always() && github.event_name != 'pull_request' && (needs.build.result == 'failure' || needs.deploy.result == 'failure' || needs.verify.result == 'failure')
    needs: [build, deploy, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Record actual release failure
        run: echo 'Release failed. A failed version/asset verification is not a completed release. External delivery requires an explicitly configured private recipient.' >> "$GITHUB_STEP_SUMMARY"
      - name: Optional technical notification
        env:
          NICO_ALERT_KIND: release-failed
          NICO_OPERATIONS_WEBHOOK: ${{ secrets.NICO_OPERATIONS_WEBHOOK }}
          NICO_OPERATIONS_ALLOWED_HOSTS: ${{ secrets.NICO_OPERATIONS_ALLOWED_HOSTS }}
        run: node scripts/notify-operations.mjs
