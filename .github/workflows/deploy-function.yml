name: Deploy Nico cloud API
# Deploy the API separately from Pages; verify the public/private boundary afterwards.
on:
  push:
    branches: [master]
    paths:
      - server/**
      - shared/**
      - supabase/functions/**
      - scripts/release-info.mjs
      - scripts/prepare-release.mjs
      - scripts/verify-deployment.mjs
      - .github/workflows/deploy-function.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nico-function
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NICO_TEST_PROTOCOL_ONLY: 'true'
      VITE_APP_MODE: public
      VITE_API_URL: https://oeyirzlgqixvcxofimit.supabase.co/functions/v1/nico-api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refuse private files and secrets anywhere in the pushed history
        run: node scripts/check-repository-privacy.mjs --history --revision "${{ github.sha }}"
      - run: npm ci
      - run: npm run check
  deploy:
    needs: check
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: 2.121.0
      - run: node scripts/prepare-release.mjs
      - run: supabase functions deploy nico-api --project-ref oeyirzlgqixvcxofimit --no-verify-jwt --use-api
        if: env.SUPABASE_ACCESS_TOKEN != ''
      - name: No deployment credential configured
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo 'No CLI credential. An actual matching API deployment is required below; a skipped CLI step is not deployment success.'
      - name: Verify actual API fingerprint (also required without CLI credentials)
        run: node scripts/verify-deployment.mjs --wait
      - name: Guest read check against the deployed function
        run: node scripts/verify-guest-read.mjs https://oeyirzlgqixvcxofimit.supabase.co/functions/v1/nico-api
  notify-failure:
    if: always() && (needs.check.result == 'failure' || needs.deploy.result == 'failure')
    needs: [check, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Record actual API release failure
        run: echo 'API release or actual source verification failed. A skipped deployment is not proof of deployment.' >> "$GITHUB_STEP_SUMMARY"
      - name: Optional technical notification
        env:
          NICO_ALERT_KIND: release-failed
          NICO_OPERATIONS_WEBHOOK: ${{ secrets.NICO_OPERATIONS_WEBHOOK }}
          NICO_OPERATIONS_ALLOWED_HOSTS: ${{ secrets.NICO_OPERATIONS_ALLOWED_HOSTS }}
        run: node scripts/notify-operations.mjs
